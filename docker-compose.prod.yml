# 生产环境 docker-compose 配置
# 使用方式: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # 指定构建平台
      platforms:
        - linux/amd64
    environment:
      APP_ENV: production
      PORT: 8000
      HOST: 0.0.0.0
      LOG_LEVEL: INFO
      # 生产环境强制使用 env_file 中的配置
    env_file:
      - ./backend/.env.production
    restart: always
    networks:
      - fpai-net
    # 生产环境建议添加资源限制
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    depends_on:
      - backend
    restart: always
    ports:
      - "80:80"
    networks:
      - fpai-net

